name: Deploy web

# Builds the Wasm production distribution and publishes it (compiled
# artifacts only) into the doom-dist/ folder of
# the public kunal26das.github.io repo, whose Pages workflow serves it
# at https://kunal26das.github.io/doom/

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Browser adapter tests
        run: node --test scripts/tests/*.test.mjs

      - name: Build Wasm distribution
        run: ./gradlew verifyArchitecture :domain:jvmTest :engine:jvmTest :composeApp:jvmTest :composeApp:wasmJsBrowserDistribution --no-configuration-cache

      - name: Publish to kunal26das.github.io/doom
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_KEY" | ssh-add -
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:kunal26das/kunal26das.github.io.git site
          rm -rf site/doom-dist
          cp -r composeApp/build/dist/wasmJs/productionExecutable site/doom-dist
          # Exclude source maps from the deployed site.
          rm -f site/doom-dist/*.map
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A doom-dist
          if git diff --cached --quiet; then
            echo "doom-dist unchanged; nothing to publish"
            exit 0
          fi
          git commit -m "Deploy doom web from kunal26das/doom@${GITHUB_SHA::7}"
          git push origin HEAD:master
