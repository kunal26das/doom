name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser adapter tests
        run: node --test scripts/tests/*.test.mjs
      - name: Architecture and regression tests
        run: ./gradlew verifyArchitecture :domain:jvmTest :engine:jvmTest :composeApp:jvmTest --no-configuration-cache
      - name: Compile web application
        run: ./gradlew :composeApp:compileKotlinWasmJs --no-configuration-cache
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            engine/build/reports/tests/
            composeApp/build/reports/tests/
